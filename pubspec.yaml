name: streamaura
description: Webcams del mundo + Radio + Momentos compartidos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_analytics: ^10.7.4

  # State Management
  provider: ^6.1.1

  # Media
  video_player: ^2.8.2
  youtube_player_flutter: ^8.1.2
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # RSS & Network
  http: ^1.2.0
  webfeed_plus: ^2.1.5
  cached_network_image: ^3.3.1

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.4.0

  # Utils
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
